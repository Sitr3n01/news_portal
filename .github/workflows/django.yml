name: Django CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Settings de teste herdam base.py, que lê SECRET_KEY/DB_* do ambiente no
    # import. Compartilhado por todos os steps (collectstatic e pytest).
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: news_portal_test
      DB_USER: news_portal_user
      DB_PASSWORD: news_portal_pass
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: news_portal_test
          POSTGRES_USER: news_portal_user
          POSTGRES_PASSWORD: news_portal_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        # O lock (requirements/development.txt) é a chave do cache: muda o lock, refaz o cache.
        cache: pip
        cache-dependency-path: requirements/development.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/development.txt

    - name: Run Linting
      run: |
        ruff check .

    # Falha se aparecer segredo fora dos falsos positivos já triados em
    # .secrets.baseline (detect-secrets, instalado pelo requirements/development.txt).
    - name: Secret Scanning
      run: scripts/ci/check-secrets.sh

    # Falha se algum model mudou sem a migration correspondente.
    - name: Check Missing Migrations
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: npm

    # O CSS do Tailwind é versionado (static/css/tailwind-*.css). Recompila a partir
    # de frontend/tailwind/ e falha se o arquivo commitado não bater: uma classe nova
    # sem `npm run build:css` sumiria em produção sem ninguém ver.
    - name: Check Compiled CSS
      run: |
        npm ci
        npm run build:css
        git diff --exit-code -- static/css/

    # Builds the staticfiles manifest so {% static %} (used by the base
    # templates for the vendored JS) resolves during template rendering in
    # tests — CompressedManifestStaticFilesStorage needs it.
    - name: Collect Static Files
      run: |
        python manage.py collectstatic --noinput

    # Cobertura configurada em pyproject.toml ([tool.coverage]); fail_under
    # impede que ela caia sem ninguém perceber. O resumo vai para a página do job.
    - name: Run Tests
      run: |
        pytest --cov --cov-report=term
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Vulnerabilidades conhecidas nas versões fixadas do lock. Job separado: não é
  # o check obrigatório do master, então um aviso novo não trava merges, mas
  # aparece no PR.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    # --no-deps/--disable-pip: o lock já fixa a árvore inteira, não há o que resolver.
    - name: Audit locked requirements
      run: |
        python -m pip install pip-audit==2.10.1
        pip-audit --strict --no-deps --disable-pip -r requirements/production.txt -r requirements/development.txt
