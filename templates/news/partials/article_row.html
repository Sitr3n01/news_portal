<article class="flex flex-col md:flex-row gap-5 md:gap-6 items-start group cursor-pointer">
    <div class="flex-1">
        <a href="{% url 'news:article_detail' article.slug %}">
            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2 group-hover:text-primary transition-colors">
                {{ article.title }}
            </h3>
            <p class="text-slate-600 dark:text-slate-400 leading-relaxed line-clamp-2">
                {{ article.excerpt|default:article.content|striptags|truncatewords:30 }}
            </p>
            <div class="mt-3 flex flex-wrap items-center gap-2">
                {% if article.author %}
                <span class="font-ui text-xs font-medium text-slate-500"><span x-text="t('Por', 'By')">By</span> {{ article.author.get_full_name|default:article.author.username }}</span>
                <span class="text-slate-300">•</span>
                {% endif %}
                <span class="font-ui text-xs text-slate-400">{{ article.reading_time }} <span x-text="t('min de leitura', 'min read')">min read</span></span>
            </div>
        </a>
    </div>
    {% if article.has_cover_image %}
    <a href="{% url 'news:article_detail' article.slug %}"
        class="w-full md:w-48 aspect-video rounded bg-gray-100 dark:bg-gray-800 overflow-hidden block">
        <div class="w-full h-full bg-cover bg-center grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all"
            style="background-image: url('{{ article.cover_image_url }}');">
        </div>
    </a>
    {% endif %}
</article>
