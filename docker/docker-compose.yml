services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      # Aponta o Django para o Mailpit do compose em vez do console backend:
      # sem isto, base.py cai no default de console e nenhum e-mail sai do
      # container, mesmo com o serviço mailpit rodando ao lado.
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - DEFAULT_FROM_EMAIL=Blog da Kelly <nao-responda@localhost>
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: news_portal
      POSTGRES_USER: news_portal_user
      POSTGRES_PASSWORD: news_portal_pass
    # Só no loopback: publicado em 0.0.0.0, o banco de dev (com a senha acima,
    # que está no repositório) ficava aberto para toda a rede local.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_portal_user -d news_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  # UI de inspeção dos e-mails capturados (nada sai para a internet): http://localhost:8025
  # Só no loopback: a caixa do Mailpit guarda códigos de verificação e de
  # recuperação de senha, e não pede login para ser lida.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
