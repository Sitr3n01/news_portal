{% extends 'base_news.html' %}

{% block title %}Conta desativada - {{ news_portal_name }}{% endblock %}

{% block content %}
<div class="max-w-[480px] mx-auto px-6 xl:px-0 py-24 font-display">
    <div class="p-8 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-3xl shadow-sm text-center">
        <span
            class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-500/10 text-amber-500 mb-4">
            <span class="material-symbols-outlined">lock</span>
        </span>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2"
            x-text="t('Conta desativada', 'Account disabled')">Conta desativada</h1>
        <p class="text-slate-500 font-ui text-sm mb-8"
            x-text="t('Esta conta está desativada e não pode entrar. Se você acha que é um engano, fale com a administração.', 'This account is disabled and cannot sign in. If you think this is a mistake, contact the administration.')">
            Esta conta está desativada e não pode entrar. Se você acha que é um engano, fale com a administração.</p>

        <a href="{% url 'news:list' %}"
            class="inline-flex w-full py-3.5 px-4 bg-primary text-white font-bold rounded-xl font-ui shadow-sm hover:bg-primary/90 hover:shadow-primary/30 transition-all justify-center items-center">
            <span x-text="t('Voltar ao portal', 'Back to the portal')">Voltar ao portal</span>
        </a>
    </div>
</div>
{% endblock %}
